[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "swing-analyzer-ai-processing"
version = "0.1.0"
description = "Internal Python AI processing unit for golf swing analysis."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.133,<1",
    "langgraph>=1.1.5,<2",
    "google-genai>=1,<2",
    "orjson==3.11.7",
    "pydantic-settings>=2.13,<3",
    "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
