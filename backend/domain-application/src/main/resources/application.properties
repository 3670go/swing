spring.application.name=domain-application
ai-processing.enabled=${AI_PROCESSING_ENABLED:false}
ai-processing.base-url=${AI_PROCESSING_BASE_URL:http://127.0.0.1:8000}
ai-processing.token=${INTERNAL_API_TOKEN:}
ai-processing.timeout-seconds=${AI_PROCESSING_TIMEOUT_SECONDS:0}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${DB_MIGRATION_ENABLED:false}
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${DB_BASELINE_VERSION:3}
