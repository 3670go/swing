spring.application.name=domain-application
ai-processing.enabled=${AI_PROCESSING_ENABLED:false}
ai-processing.base-url=${AI_PROCESSING_BASE_URL:http://127.0.0.1:8000}
ai-processing.token=${INTERNAL_API_TOKEN:}
ai-processing.timeout-seconds=${AI_PROCESSING_TIMEOUT_SECONDS:0}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${DB_MIGRATION_ENABLED:false}
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${DB_BASELINE_VERSION:3}
spring.jackson.property-naming-strategy=SNAKE_CASE
client.cors-origins=${CLIENT_CORS_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:swing-media}
media.max-video-bytes=${MAX_VIDEO_BYTES:0}
media.signed-read-ttl-seconds=${SIGNED_READ_TTL_SECONDS:900}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:250MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:500MB}
action.api-key=${GPT_ACTION_API_KEY:}
action.file-hosts=${ACTION_FILE_HOSTS:files.oaiusercontent.com}
