openapi: 3.1.0
info:
  title: Swing Analyzer Internal AI API
  version: 2.0.0
  description: Frozen context-aware coaching contract between the Java Domain Application and Python AI Processing Unit.
paths:
  /internal/health:
    get:
      operationId: getInternalHealth
      security: []
      responses:
        "200":
          description: AI Processing Unit health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/v1/analyses:
    post:
      operationId: analyzeSwingMediaInternal
      security:
        - InternalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAnalysisRequest"
      responses:
        "200":
          description: Completed, limited, or rejected analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAnalysisResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/coaching/text:
    post:
      operationId: coachTextInternal
      security:
        - InternalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalTextCoachingRequest"
      responses:
        "200":
          description: Evidence-bounded text coaching content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalTextCoachingResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-server-token
  responses:
    ErrorResponse:
      description: Internal API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, model_configured]
      properties:
        service:
          type: string
          const: ai-processing
        status:
          type: string
          enum: [ready, degraded]
        model_configured:
          type: boolean
    ShotContext:
      type: object
      additionalProperties: false
      required: [shot_profile, club, camera_view, handedness, analysis_goal]
      properties:
        shot_profile:
          type: string
          enum: [full_swing, short_game]
        club:
          type: string
          minLength: 1
          maxLength: 64
        camera_view:
          type: string
          enum: [face_on, down_the_line]
        handedness:
          type: string
          enum: [right, left]
        analysis_goal:
          type: string
          enum: [posture_correction, shot_result, comparison]
        short_game_type:
          type: [string, "null"]
          maxLength: 64
        video_type:
          type: [string, "null"]
          maxLength: 64
        shot_result:
          type: [string, "null"]
          maxLength: 128
    CoachingScope:
      type: object
      additionalProperties: false
      required: [shot_profile, club, club_group, short_game_type]
      properties:
        shot_profile:
          type: string
          enum: [full_swing, short_game]
        club:
          type: [string, "null"]
          maxLength: 64
        club_group:
          type: [string, "null"]
          maxLength: 64
        short_game_type:
          type: [string, "null"]
          maxLength: 64
      anyOf:
        - properties:
            club:
              type: string
              minLength: 1
              maxLength: 64
        - properties:
            club_group:
              type: string
              minLength: 1
              maxLength: 64
    RequestContext:
      type: object
      additionalProperties: false
      required: [user_message, user_feel, selected_shot_context, media_presence]
      properties:
        user_message:
          type: string
          minLength: 1
          maxLength: 4000
        user_feel:
          type: [string, "null"]
          maxLength: 1000
        selected_shot_context:
          $ref: "#/components/schemas/ShotContext"
        media_presence:
          type: boolean
    ActiveCoachingTopic:
      type: object
      additionalProperties: false
      required:
        - topic_id
        - version
        - user_problem
        - root_problem
        - scope
        - active_hypothesis
        - current_experiment
        - carry_forward_feel
      properties:
        topic_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        user_problem:
          type: string
          minLength: 1
          maxLength: 300
        root_problem:
          type: [string, "null"]
          maxLength: 300
        scope:
          $ref: "#/components/schemas/CoachingScope"
        active_hypothesis:
          type: [string, "null"]
          maxLength: 500
        current_experiment:
          type: [string, "null"]
          maxLength: 500
        carry_forward_feel:
          type: [string, "null"]
          maxLength: 300
    RoadmapMilestoneSummary:
      type: object
      additionalProperties: false
      required: [milestone_id, version, title, evidence_level, completion_condition]
      properties:
        milestone_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        evidence_level:
          type: string
          enum:
            - NOT_STARTED
            - USER_REPORTED_PROGRESS
            - RESULT_REPEATED
            - VIDEO_VERIFIED_PROGRESS
            - MILESTONE_COMPLETED
        completion_condition:
          type: string
          minLength: 1
          maxLength: 500
    RoadmapContext:
      type: object
      additionalProperties: false
      required:
        - roadmap_id
        - version
        - target_swing
        - current_milestone
        - completed_milestones
        - next_completion_condition
      properties:
        roadmap_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        target_swing:
          type: string
          minLength: 1
          maxLength: 500
        current_milestone:
          anyOf:
            - $ref: "#/components/schemas/RoadmapMilestoneSummary"
            - type: "null"
        completed_milestones:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RoadmapMilestoneSummary"
        next_completion_condition:
          type: [string, "null"]
          maxLength: 500
    AnalysisEpisodeSummary:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - observation_summary
        - evidence_level
        - captured_at
        - scope
      properties:
        episode_id:
          type: string
          format: uuid
        observation_summary:
          type: string
          minLength: 1
          maxLength: 700
        evidence_level:
          type: string
          enum: [TEXT_ONLY, USER_REPORTED, RESULT_REPEATED, VIDEO_OBSERVED]
        captured_at:
          type: string
          format: date-time
        scope:
          $ref: "#/components/schemas/CoachingScope"
    UserContextFact:
      type: object
      additionalProperties: false
      required:
        - fact_id
        - version
        - statement
        - evidence_level
        - scope
        - source_episode_ids
      properties:
        fact_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        statement:
          type: string
          minLength: 1
          maxLength: 500
        evidence_level:
          type: string
          enum: [USER_REPORTED, RESULT_REPEATED, VIDEO_OBSERVED, REPEATED_OBSERVATION, GLOBAL_CANDIDATE]
        scope:
          $ref: "#/components/schemas/CoachingScope"
        source_episode_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid
    PendingOpenLoop:
      type: object
      additionalProperties: false
      required:
        - open_loop_id
        - version
        - state
        - carry_forward_feel
        - next_single_change
        - next_verification
        - predicted_result
      properties:
        open_loop_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        state:
          type: string
          const: PENDING
        carry_forward_feel:
          type: [string, "null"]
          maxLength: 300
        next_single_change:
          type: string
          minLength: 1
          maxLength: 500
        next_verification:
          type: string
          minLength: 1
          maxLength: 500
        predicted_result:
          type: [string, "null"]
          maxLength: 500
    ProgressEventSummary:
      type: object
      additionalProperties: false
      required: [progress_event_id, topic_id, milestone_id, progress_level, user_signal]
      properties:
        progress_event_id:
          type: string
          format: uuid
        topic_id:
          type: string
          format: uuid
        milestone_id:
          type: [string, "null"]
          format: uuid
        progress_level:
          type: string
          enum: [USER_REPORTED_PROGRESS, RESULT_REPEATED, VIDEO_VERIFIED_PROGRESS, MILESTONE_COMPLETED]
        user_signal:
          type: string
          minLength: 1
          maxLength: 500
    RecognizedTopicSummary:
      type: object
      additionalProperties: false
      required: [topic_id, milestone_version, recognized_at]
      properties:
        topic_id:
          type: string
          format: uuid
        milestone_version:
          type: integer
          minimum: 1
        recognized_at:
          type: string
          format: date-time
    RecognitionContext:
      type: object
      additionalProperties: false
      required: [unrecognized_progress_events, recently_recognized_topics, last_roadmap_reveal_at]
      properties:
        unrecognized_progress_events:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ProgressEventSummary"
        recently_recognized_topics:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RecognizedTopicSummary"
        last_roadmap_reveal_at:
          type: [string, "null"]
          format: date-time
    ContextPacket:
      type: object
      additionalProperties: false
      required:
        - context_snapshot_id
        - context_snapshot_version
        - request_context
        - active_coaching_topic
        - roadmap_context
        - recent_dialogue
        - relevant_analysis_episodes
        - relevant_user_context_facts
        - pending_open_loop
        - recognition_context
      properties:
        context_snapshot_id:
          type: string
          format: uuid
        context_snapshot_version:
          type: integer
          minimum: 1
        request_context:
          $ref: "#/components/schemas/RequestContext"
        active_coaching_topic:
          anyOf:
            - $ref: "#/components/schemas/ActiveCoachingTopic"
            - type: "null"
        roadmap_context:
          anyOf:
            - $ref: "#/components/schemas/RoadmapContext"
            - type: "null"
        recent_dialogue:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/HistoryMessage"
        relevant_analysis_episodes:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnalysisEpisodeSummary"
        relevant_user_context_facts:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/UserContextFact"
        pending_open_loop:
          anyOf:
            - $ref: "#/components/schemas/PendingOpenLoop"
            - type: "null"
        recognition_context:
          $ref: "#/components/schemas/RecognitionContext"
    HistoryMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
        interaction_meta:
          anyOf:
            - $ref: "#/components/schemas/InteractionMeta"
            - type: "null"
    InteractionMeta:
      type: object
      additionalProperties: false
      required: [response_mode, positive_topic, question_topic, invite_mode]
      properties:
        response_mode:
          type: string
          enum: [short, standard, deep]
        positive_topic:
          type: [string, "null"]
          maxLength: 80
        question_topic:
          type: [string, "null"]
          maxLength: 80
        invite_mode:
          type: string
          enum:
            - none
            - compare_good_bad
            - locate_timing
            - recall_specific_shot
            - connect_body_feel
            - follow_up_experiment
    MediaReference:
      type: object
      additionalProperties: false
      required: [media_id, kind, content_type, size_bytes, sha256, read_url]
      properties:
        media_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [photo, video]
        content_type:
          type: string
          minLength: 1
          maxLength: 128
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        read_url:
          type: string
          format: uri
    InternalAnalysisRequest:
      type: object
      additionalProperties: false
      required: [request_id, analysis_run_id, media, context_packet]
      properties:
        request_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        media:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/MediaReference"
        context_packet:
          $ref: "#/components/schemas/ContextPacket"
    ObservationItem:
      type: object
      additionalProperties: false
      required: [subject, reference, phase, state, assessment_category, confidence]
      properties:
        timestamp:
          type: [string, "null"]
        subject:
          type: string
          minLength: 1
          maxLength: 80
        reference:
          type: string
          minLength: 1
          maxLength: 120
        phase:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 300
        assessment_category:
          $ref: "#/components/schemas/AssessmentCategory"
        confidence:
          type: number
          minimum: 0
          maximum: 1
    VisionObservation:
      type: object
      additionalProperties: false
      required: [is_golf_media, golf_media_reason, observations, cannot_determine]
      properties:
        is_golf_media:
          type: boolean
        golf_media_reason:
          type: string
          minLength: 1
          maxLength: 300
        observations:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/ObservationItem"
        cannot_determine:
          type: array
          maxItems: 12
          items:
            type: string
    AssessmentFinding:
      type: object
      additionalProperties: false
      required: [category, observation_indexes, summary, confidence]
      properties:
        category:
          $ref: "#/components/schemas/AssessmentCategory"
        observation_indexes:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: integer
            minimum: 0
        summary:
          type: string
          minLength: 1
          maxLength: 500
        confidence:
          type: number
          minimum: 0
          maximum: 1
    BaseAssessment:
      type: object
      additionalProperties: false
      required: [primary_category, importance, findings, cannot_determine, assessment_hash]
      properties:
        primary_category:
          $ref: "#/components/schemas/AssessmentCategory"
        importance:
          type: string
          enum: [high, medium, low]
        findings:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/AssessmentFinding"
        cannot_determine:
          type: array
          maxItems: 12
          items:
            type: string
        assessment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    CoachContent:
      type: object
      additionalProperties: false
      required:
        - evidence_mode
        - direct_answer
        - causal_chain
        - evidence_boundary
        - cannot_determine
        - observation_indexes
      properties:
        evidence_mode:
          type: string
          enum: [text_only, photo_limited, video_ready]
        direct_answer:
          type: string
          minLength: 1
          maxLength: 700
        causal_chain:
          type: array
          maxItems: 3
          items:
            type: string
        evidence_boundary:
          type: string
          minLength: 1
          maxLength: 300
        cannot_determine:
          type: array
          maxItems: 8
          items:
            type: string
        observation_indexes:
          type: array
          maxItems: 12
          items:
            type: integer
            minimum: 0
        base_assessment_hash:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        single_change:
          type: [string, "null"]
          maxLength: 500
        verification:
          type: [string, "null"]
          maxLength: 500
        preserve_candidate:
          type: [string, "null"]
          maxLength: 220
        preserve_topic:
          type: [string, "null"]
          maxLength: 80
        follow_up_information_needed:
          type: [string, "null"]
          maxLength: 180
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [source_type, source_id]
      properties:
        source_type:
          type: string
          enum: [MESSAGE, OBSERVATION, ANALYSIS_EPISODE, PROGRESS_EVENT, ROADMAP_MILESTONE]
        source_id:
          type: string
          minLength: 1
          maxLength: 80
    ProblemReframeCandidate:
      type: object
      additionalProperties: false
      required: [previous_problem, proposed_root_problem, causal_explanation, evidence_references]
      properties:
        previous_problem:
          type: string
          minLength: 1
          maxLength: 300
        proposed_root_problem:
          type: string
          minLength: 1
          maxLength: 300
        causal_explanation:
          type: string
          minLength: 1
          maxLength: 700
        evidence_references:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/EvidenceReference"
    CoachingTopicCandidate:
      type: object
      additionalProperties: false
      required: [action, target_topic_id, expected_version, scope, title]
      properties:
        action:
          type: string
          enum: [REFRAME_CURRENT, CREATE_NEW, ACTIVATE_EXISTING, RESOLVE_CURRENT]
        target_topic_id:
          type: [string, "null"]
          format: uuid
        expected_version:
          type: [integer, "null"]
          minimum: 1
        scope:
          $ref: "#/components/schemas/CoachingScope"
        title:
          type: string
          minLength: 1
          maxLength: 200
    RoadmapUpdateCandidate:
      type: object
      additionalProperties: false
      required:
        - target_type
        - target_id
        - expected_version
        - proposed_transition
        - proposed_content
        - evidence_references
      properties:
        target_type:
          type: string
          enum: [ROADMAP, MILESTONE]
        target_id:
          type: [string, "null"]
          format: uuid
        expected_version:
          type: [integer, "null"]
          minimum: 1
        proposed_transition:
          type: string
          enum:
            - CREATE
            - UPDATE
            - MARK_USER_REPORTED_PROGRESS
            - MARK_RESULT_REPEATED
            - MARK_VIDEO_VERIFIED_PROGRESS
            - COMPLETE
        proposed_content:
          type: [string, "null"]
          maxLength: 500
        evidence_references:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/EvidenceReference"
    ProgressCandidate:
      type: object
      additionalProperties: false
      required:
        - target_milestone_id
        - expected_version
        - progress_level
        - user_signal
        - evidence_references
      properties:
        target_milestone_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          minimum: 1
        progress_level:
          type: string
          enum: [USER_REPORTED_PROGRESS, RESULT_REPEATED, VIDEO_VERIFIED_PROGRESS, MILESTONE_COMPLETED]
        user_signal:
          type: string
          minLength: 1
          maxLength: 500
        evidence_references:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/EvidenceReference"
    RecognitionCandidate:
      type: object
      additionalProperties: false
      required: [target, proposed_intensity, recognition_content]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 200
        proposed_intensity:
          type: string
          enum: [ACKNOWLEDGEMENT, SPECIFIC_RECOGNITION, PROGRESS_DECLARATION, IDENTITY_CONNECTION]
        recognition_content:
          type: string
          minLength: 1
          maxLength: 500
    OpenLoopCandidate:
      type: object
      additionalProperties: false
      required:
        - carry_forward_feel
        - next_single_change
        - next_verification
        - completion_condition
        - predicted_result
        - question
      properties:
        carry_forward_feel:
          type: [string, "null"]
          maxLength: 300
        next_single_change:
          type: string
          minLength: 1
          maxLength: 500
        next_verification:
          type: string
          minLength: 1
          maxLength: 500
        completion_condition:
          type: string
          minLength: 1
          maxLength: 500
        predicted_result:
          type: [string, "null"]
          maxLength: 500
        question:
          type: string
          minLength: 1
          maxLength: 300
    CoachingTurnPlan:
      type: object
      additionalProperties: false
      required:
        - coach_content
        - problem_reframe_candidate
        - coaching_topic_candidate
        - roadmap_update_candidates
        - progress_candidate
        - recognition_candidate
        - open_loop_candidate
      properties:
        coach_content:
          $ref: "#/components/schemas/CoachContent"
        problem_reframe_candidate:
          anyOf:
            - $ref: "#/components/schemas/ProblemReframeCandidate"
            - type: "null"
        coaching_topic_candidate:
          anyOf:
            - $ref: "#/components/schemas/CoachingTopicCandidate"
            - type: "null"
        roadmap_update_candidates:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/RoadmapUpdateCandidate"
        progress_candidate:
          anyOf:
            - $ref: "#/components/schemas/ProgressCandidate"
            - type: "null"
        recognition_candidate:
          anyOf:
            - $ref: "#/components/schemas/RecognitionCandidate"
            - type: "null"
        open_loop_candidate:
          anyOf:
            - $ref: "#/components/schemas/OpenLoopCandidate"
            - type: "null"
    InternalAnalysisResponse:
      type: object
      additionalProperties: false
      required: [request_id, analysis_run_id, status, observation, base_assessment, coaching_turn_plan]
      properties:
        request_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded, limited, rejected]
        observation:
          $ref: "#/components/schemas/VisionObservation"
        base_assessment:
          anyOf:
            - $ref: "#/components/schemas/BaseAssessment"
            - type: "null"
        coaching_turn_plan:
          anyOf:
            - $ref: "#/components/schemas/CoachingTurnPlan"
            - type: "null"
    InternalTextCoachingRequest:
      type: object
      additionalProperties: false
      required: [request_id, context_packet]
      properties:
        request_id:
          type: string
          format: uuid
        context_packet:
          $ref: "#/components/schemas/ContextPacket"
    InternalTextCoachingResponse:
      type: object
      additionalProperties: false
      required: [request_id, coaching_turn_plan]
      properties:
        request_id:
          type: string
          format: uuid
        coaching_turn_plan:
          $ref: "#/components/schemas/CoachingTurnPlan"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, retryable, request_id]
      properties:
        code:
          type: string
          enum:
            - INTERNAL_AUTH_FAILED
            - MEDIA_TYPE_UNSUPPORTED
            - MEDIA_UNAVAILABLE
            - MEDIA_DECODE_FAILED
            - ANALYSIS_CONTRACT_FAILED
            - MODEL_RATE_LIMITED
            - MODEL_UNAVAILABLE
            - MODEL_TIMEOUT
            - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 300
        retryable:
          type: boolean
        request_id:
          type: string
          format: uuid
